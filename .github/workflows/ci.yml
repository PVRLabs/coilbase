name: CI
on: [push, pull_request]

jobs:
  slow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install StatLite for the smoke test
        run: |
          curl -fsSL https://github.com/PVRLabs/statlite/releases/download/v0.7.2/statlite_0.7.2_linux_amd64.tar.gz -o "$RUNNER_TEMP/statlite.tar.gz"
          echo 'a426e562b39df9ce38b24e9f8e24094eb9ec1560fa862142d9f766cd13ad50fe  '"$RUNNER_TEMP/statlite.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/statlite.tar.gz" -C "$RUNNER_TEMP" statlite
          echo "STATLITE_BIN=$RUNNER_TEMP/statlite" >> "$GITHUB_ENV"
      - run: mvn -B -Pslow-tests verify
  core-java17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -pl coilbase-core -am verify
  java21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean install
      - name: Check library bytecode targets
        run: |
          javap -verbose coilbase-core/target/classes/pvrlabs/coilbase/Repository.class | grep 'major version: 61'
          javap -verbose coilbase-jex/target/classes/pvrlabs/coilbase/jex/CoilBaseJexApplication.class | grep 'major version: 65'
      - run: mvn -B -f examples/hello-coilbase/pom.xml verify
      - run: mvn -B -f verification/metrics/pom.xml verify
      - run: python3 scripts/verify-consumers.py
